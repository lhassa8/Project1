[project]
name = "agent-runner"
version = "0.2.0"
description = "Native Claude tool-call loop with interception, shadow mode, approval gates, and MCP bridging"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "claude",
    "anthropic",
    "agent",
    "tool-calling",
    "mcp",
    "shadow-mode",
    "approval",
    "interceptor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agent-runner = "main:main"
agent-runner-mcp = "agent_runner.mcp_server:main"
